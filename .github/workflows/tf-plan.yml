name: Terraform Plan

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment
        type: string
        default: "dev"
    outputs:
      plan_blob_name:
        value: ${{ jobs.plan.outputs.plan_blob_name }}

permissions: {}

jobs:
  plan:
    name: Terraform Plan
    # Never run for from forks
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-plan
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      security-events: write
    outputs:
      plan_blob_name: ${{ steps.plan_path.outputs.plan_blob_name }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-cache
      ENVIRONMENT: ${{ inputs.environment }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
      WORKING_DIR: ./environments/${{ inputs.environment }}
      TF_PLAN_STORAGE_ACCOUNT: ${{ vars.TF_PLAN_STORAGE_ACCOUNT }}
      TF_INPUT: 0
      TF_VAR_ci_run: "true"
      GITHUB_REPOSITORY_PATH: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v7

      - name: Create plugin cache dir
        run: mkdir -p "${TF_PLUGIN_CACHE_DIR:?TF_PLUGIN_CACHE_DIR is not set}"

      - uses: ./.github/actions/tf-init
        with:
          working_directory: ${{ env.WORKING_DIR }}

      - name: Terraform plan blob name
        id: plan_path
        env:
          GITHUB_REPOSITORY_PATH: ${{ github.repository }}
          ENVIRONMENT: ${{ inputs.environment }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          echo "plan_blob_name=${GITHUB_REPOSITORY_PATH}/${ENVIRONMENT}/${GITHUB_RUN_ID_VALUE}-${GITHUB_RUN_ATTEMPT_VALUE}/tfplan" >> "$GITHUB_OUTPUT"

      # Output is tee'd to a file so the failure summary does not depend on the
      # setup-terraform wrapper outputs (stdout/stderr), which may be disabled or truncated.
      # pipefail keeps the step failing when terraform fails (otherwise tee's exit code wins).
      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -o pipefail
          terraform plan -no-color -var-file=terraform.tfvars -out=tfplan 2>&1 | tee plan_output.txt

      - name: Convert plan to JSON
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform show -json tfplan > tfplan.json

      # Build a short, non-sensitive summary: resource address + action only.
      # Never touches attribute values, so tags/IPs/keys etc. never leak into the PR.
      - name: Build plan summary
        id: plan_summary
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          jq -r '
            def sym(a):
              if a == ["create"] then "🟢 add"
              elif a == ["update"] then "🟡 change"
              elif a == ["delete"] then "🔴 destroy"
              elif (a == ["create","delete"]) or (a == ["delete","create"]) then "♻️ replace"
              else "• " + (a | join(",")) end;

            [.resource_changes[] | select(.change.actions != ["no-op"])] as $changes
            | ($changes | map(select(.change.actions == ["create"])) | length) as $add
            | ($changes | map(select(.change.actions == ["update"])) | length) as $change
            | ($changes | map(select(.change.actions == ["delete"])) | length) as $destroy
            | ($changes | map(select((.change.actions == ["create","delete"]) or (.change.actions == ["delete","create"]))) | length) as $replace
            | "**Plan summary:** \($add) to add, \($change) to change, \($destroy) to destroy" +
              (if $replace > 0 then ", \($replace) to replace" else "" end),
              "",
              (if ($changes | length) == 0 then "_No resource changes._"
               else ($changes[] | "- \(sym(.change.actions)) `\(.address)`") end)
          ' tfplan.json > plan_summary.md

      # When `terraform plan` fails there is nothing to parse, so write a failure
      # summary to the same file the success path uses. Both outcomes then go through
      # the single sticky comment below, so a later pass replaces the failure comment.
      - name: Build plan failure summary
        if: always() && github.event_name == 'pull_request' && steps.plan.outcome == 'failure'
        working-directory: ${{ env.WORKING_DIR }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "**❌ Plan failed**"
            echo
            echo '```'
            tail -n 40 plan_output.txt
            echo '```'
            echo
            echo "<sub>[Run ${GITHUB_RUN_ID}](${RUN_URL})</sub>"
          } > plan_summary.md

      - name: PR comment
        if: always() && github.event_name == 'pull_request' && (steps.plan.outcome == 'success' || steps.plan.outcome == 'failure')
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c
