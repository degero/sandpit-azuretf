name: OpenSSF Scorecard analysis
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - CHANGELOG.md
  schedule:
    - cron: "30 1 * * 6" # weekly, Saturday 01:30 UTC
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # only if SARIF upload is enabled
      id-token: write # only if publish_results is true
      contents: read
      actions: read # this and below only required for private repos, harmless on public ones
      issues: read
      pull-requests: read
      checks: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results: true sends the score to the public
          # OpenSSF dashboard (securityscorecards.dev) and enables the
          # README badge. Only meaningful for public repos — leave
          # false (default) for private repos.
          publish_results: true

      # Uploaded as a build artifact so results are visible even without
      # GitHub Advanced Security / before the SARIF upload below lands
      # in the Security tab. Auto-expires after 5 days.
      - name: Upload artifact
        if: ${{ vars.ENABLE_SARIF_UPLOAD == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        if: ${{ vars.ENABLE_SARIF_UPLOAD == 'true' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: openssf-scorecard
