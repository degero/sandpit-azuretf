name: Trivy Terraform Scan

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: trivy-iac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-scan:
    name: Trivy scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter needs this to list PR files
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d #v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            terraform:
              - "**.tf"
              - "**.tfvars"
              - "backend.hcl"
              - "**/Dockerfile*"
              - "**/*.yaml"
              - "**/*.yml"

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: github.event_name != 'pull_request' || steps.filter.outputs.terraform == 'true'
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1" # set to "0" for report-only mode
          hide-progress: true
          # trivyignore: .trivyignore
