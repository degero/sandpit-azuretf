name: Changelog

on:
  push:
    branches: [main]
    # Don't re-run when the only change is the changelog itself
    paths-ignore:
      - CHANGELOG.md

# Serialize runs so two quick merges don't race on the push
concurrency:
  group: changelog
  cancel-in-progress: false

permissions:
  contents: read # writes happen via the deploy key, not GITHUB_TOKEN

jobs:
  changelog:
    runs-on: ubuntu-latest
    # Extra loop guard: skip commits made by this workflow
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DOCO_DEPLOY_KEY }} # swap in your secret's name
          fetch-depth: 0 # git-cliff needs full history

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md [skip ci]"
          git push origin HEAD:main
